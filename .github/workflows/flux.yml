name: Flux BVB

on:
  schedule:
    - cron: "0 * * * *"     # din ora in ora, non-stop
  workflow_dispatch:        # buton de rulare manuala
  push:
    branches: [main]
    paths:
      - "flux_bvb.py"
      - "flux_template.html"
      - ".github/workflows/flux.yml"

concurrency:
  group: flux-bvb
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizeaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pagina se scrie in public/, care devine artefactul publicat.
      # Cand vrei Telegram/mail: adauga secretele si sterge "--no-notify".
      - name: Ruleaza monitorul
        env:
          FLUX_TG_TOKEN:   ${{ secrets.FLUX_TG_TOKEN }}
          FLUX_TG_CHAT:    ${{ secrets.FLUX_TG_CHAT }}
          FLUX_SMTP_HOST:  ${{ secrets.FLUX_SMTP_HOST }}
          FLUX_SMTP_USER:  ${{ secrets.FLUX_SMTP_USER }}
          FLUX_SMTP_PASS:  ${{ secrets.FLUX_SMTP_PASS }}
          FLUX_MAIL_TO:    ${{ secrets.FLUX_MAIL_TO }}
          FLUX_URL_PUBLIC: ${{ vars.FLUX_URL_PUBLIC }}
        run: |
          python flux_bvb.py --out public/index.html --no-notify
          touch public/.nojekyll

      # Doar memoria de deduplicare se salveaza in repo. Pagina NU mai trece
      # prin commit: push-urile facute cu tokenul implicit nu declanseaza
      # publicarea Pages, si exact asta blocase actualizarea site-ului.
      - name: Salveaza memoria
        run: |
          git config user.name  "flux-bot"
          git config user.email "flux-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Nimic nou de memorat."
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publica:
    needs: actualizeaza
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4