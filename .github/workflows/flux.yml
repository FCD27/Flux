name: Flux BVB

on:
  schedule:
    # Orele sunt UTC. Vara Romania e UTC+3, iarna UTC+2.
    # Adica la fiecare 30 de minute, aproximativ 07:00-19:00 ora Romaniei, luni-vineri.
    - cron: "*/30 4-16 * * 1-5"
  workflow_dispatch:        # buton de rulare manuala, in tab-ul Actions

# O singura rulare odata: doua simultane s-ar calca pe state.json
concurrency:
  group: flux-bvb
  cancel-in-progress: false

permissions:
  contents: write           # singura permisiune necesara: scrie index.html si state.json

jobs:
  actualizeaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # FAZA 1: doar pagina, fara notificari.
      # Cand vrei Telegram/mail: adauga secretele in Settings si sterge "--no-notify".
      - name: Ruleaza monitorul
        env:
          FLUX_TG_TOKEN:   ${{ secrets.FLUX_TG_TOKEN }}
          FLUX_TG_CHAT:    ${{ secrets.FLUX_TG_CHAT }}
          FLUX_SMTP_HOST:  ${{ secrets.FLUX_SMTP_HOST }}
          FLUX_SMTP_USER:  ${{ secrets.FLUX_SMTP_USER }}
          FLUX_SMTP_PASS:  ${{ secrets.FLUX_SMTP_PASS }}
          FLUX_MAIL_TO:    ${{ secrets.FLUX_MAIL_TO }}
          FLUX_URL_PUBLIC: ${{ vars.FLUX_URL_PUBLIC }}
        run: python flux_bvb.py --out index.html --quiet --no-notify

      # Pages serveste direct din ramura, deci publicarea inseamna doar un commit.
      - name: Publica pagina
        run: |
          git config user.name  "flux-bot"
          git config user.email "flux-bot@users.noreply.github.com"
          git add index.html state.json
          if git diff --staged --quiet; then
            echo "Nimic schimbat."
          else
            git commit -m "flux: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
